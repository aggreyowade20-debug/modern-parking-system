<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Parking System - Kenya</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #333; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; max-width: 600px; margin: 20px auto; }
        .slot { padding: 20px; border-radius: 8px; font-weight: bold; color: white; font-size: 16px; }
        .available { background-color: #2ecc71; }
        .occupied { background-color: #e74c3c; }
        .controls { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: 20px auto; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 70%; margin-right: 5px; font-size: 16px; text-transform: uppercase; }
        button { padding: 10px 15px; font-size: 16px; background: #3498db; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #2980b9; }
        #message { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <h1>🚗 Modern Parking System - Kenya</h1>
    <p>Live Visual Display of Available Parking Slots</p>

    <div class="grid" id="slot-grid"></div>

    <div class="controls">
        <h3>Vehicle Gate Control</h3>
        <input type="text" id="plateInput" placeholder="Enter Plate e.g., KBA123A">
        <br><br>
        <button onclick="handleEntry()">Vehicle Entry</button>
        <button onclick="handleExit()" style="background: #e67e22;">Vehicle Exit</button>
        <div id="message"></div>
    </div>

    <script>
        const API_URL = "https://modern-parking-system.onrender.com";

        async function fetchSlots() {
            try {
                const response = await fetch(`${API_URL}/slots`);
                const data = await response.json();
                const grid = document.getElementById("slot-grid");
                grid.innerHTML = "";

                for (const [id, details] of Object.entries(data.slots)) {
                    const div = document.createElement("div");
                    div.className = `slot ${details.is_occupied ? 'occupied' : 'available'}`;
                    div.innerHTML = `Slot ${id}<br><small>${details.is_occupied ? details.vehicle_plate : 'Available'}</small>`;
                    grid.appendChild(div);
                }
            } catch (error) {
                console.error("Error fetching slots:", error);
            }
        }

        async function handleEntry() {
            const plate = document.getElementById("plateInput").value.trim();
            if (!plate) { alert("Please enter a vehicle plate number."); return; }

            const response = await fetch(`${API_URL}/entry`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ plate_number: plate })
            });
            const result = await response.json();
            document.getElementById("message").innerText = response.ok ? result.message : result.detail;
            fetchSlots();
        }

        async function handleExit() {
            const plate = document.getElementById("plateInput").value.trim();
            if (!plate) { alert("Please enter a vehicle plate number."); return; }

            const response = await fetch(`${API_URL}/exit`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ plate_number: plate })
            });
            const result = await response.json();
            if (response.ok) {
                document.getElementById("message").innerText = `${result.message} Fee: KES ${result.amount_to_pay_kes}`;
            } else {
                document.getElementById("message").innerText = result.detail;
            }
            fetchSlots();
        }

        // Fetch slots on load and refresh every 3 seconds
        fetchSlots();
        setInterval(fetchSlots, 3000);
    </script>
</body>
</html>
